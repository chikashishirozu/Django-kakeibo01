{% extends 'budget/base.html' %}

{% block title %}ログイン - 家計簿アプリ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-3"><i class="fas fa-wallet me-2"></i>ログイン</h1>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            {% if form.errors %}
                <div class="alert alert-danger">ユーザー名またはパスワードが正しくありません。</div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">ユーザー名</label>
                <input type="text" name="username" id="{{ form.username.id_for_label }}"
                       class="form-control" autofocus autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="{{ form.password.id_for_label }}">パスワード</label>
                <input type="password" name="password" id="{{ form.password.id_for_label }}"
                       class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">ログイン</button>
        </form>

        {% if allow_signup %}
        <p class="text-center mt-3 mb-0">
            アカウントをお持ちでない方は
            <a href="{% url 'signup' %}">新規登録</a>
        </p>
        {% endif %}
    </div>
</div>
{% endblock %}
